<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dashboard Inventory iPhone</title>
<style>
  :root{ --bg:#0b0f19; --panel:#131a2b; --border:#232d45; --text:#e8ecf7; --muted:#8b93ab; --accent:#3b82f6; --danger:#ef4444; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  h1{font-size:18px;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input{width:100%;padding:10px 12px;margin-bottom:16px;background:#0f1524;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .err{color:var(--danger);font-size:13px;margin:-8px 0 16px;min-height:16px;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>📦 Dashboard Inventory iPhone</h1>
    <p class="sub">Masuk untuk melanjutkan</p>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button type="submit" id="submitBtn">Masuk</button>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal.');
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>
